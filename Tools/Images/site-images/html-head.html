<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">

<!-- Apple -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- PWA -->
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FFFFFF">

<!-- Safari -->
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000">

<!-- Windows legado -->
<meta name="msapplication-config" content="/browserconfig.xml">
<meta name="msapplication-TileColor" content="#FFFFFF">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Meu Site">
<meta property="og:description" content="Aplicação web">
<meta property="og:image" content="https://example.com/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Meu Site">
<meta property="og:locale" content="pt_BR">

<!-- X / Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Meu Site">
<meta name="twitter:description" content="Aplicação web">
<meta name="twitter:image" content="https://example.com/share.png">
